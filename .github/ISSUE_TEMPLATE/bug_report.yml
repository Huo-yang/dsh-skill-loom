name: Bug report
description: Report a Skill Loom problem
labels: ["bug"]
body:
  - type: input
    id: versions
    attributes:
      label: DSH, plugin, and OS versions
      placeholder: DSH 0.2.2-rc.5 / Skill Loom 0.1.0 / Windows 11
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a minimal example and remove tokens and private session data.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
